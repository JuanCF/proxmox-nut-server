[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:upsd]
# Run as root: the driver (see user = root in ups.conf) creates its control
# socket as root:root, which upsd running as `nut` cannot access.
command=/usr/sbin/upsd -F -u root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/upsd.log
stderr_logfile=/var/log/supervisor/upsd.err

[program:upsmon]
# upsmon -F forks an unprivileged child that survives a plain restart; the
# wrapper traps supervisord's stop signal and brings the whole pair down.
command=/usr/local/bin/upsmon-wrapper
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/upsmon.log
stderr_logfile=/var/log/supervisor/upsmon.err

[program:nutwatch]
command=/opt/nutwatch/venv/bin/python /opt/nutwatch/app.py
directory=/opt/nutwatch
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nutwatch.log
stderr_logfile=/var/log/supervisor/nutwatch.err
